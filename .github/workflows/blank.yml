# GitHub Action for generating a contribution graph with a snake eating your contributions.
name: Generate Snake

# Controls when the action will run.
on:
  schedule:
    # every 12 hours
    - cron: "0 */12 * * *"

  # Allows manual trigger from the Actions tab.
  workflow_dispatch:

  # Also run on every push to the main branch.
  push:
    branches:
      - main

# The sequence of runs in this workflow:
jobs:
  # This workflow contains a single job called "build".
  build:
    # The type of runner that the job will run on.
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job.
    steps:
      # Step 1: Clone the repository.
      - name: Clone repo
        uses: actions/checkout@v3

      # Step 2: Generate the snake files in the 'dist' directory.
      - name: Generate the snake files
        uses: Platane/snk@v3
        id: snake-gif
        with:
          # Replace 'github_user_name' with your GitHub username for accurate data.
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Show the build status (optional).
      - name: Show build status
        run: git status

      # Step 4: Push the generated files to the 'output' branch.
      - name: Push new files to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output  # Pushes to the "output" branch.
          build_dir: dist        # Pushes the generated files from the 'dist' directory.
          commit_message: Update snake animations  # Custom commit message.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
